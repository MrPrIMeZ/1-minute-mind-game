  <!-- gold "1 minute" arc: top of the dial, a quarter turn -->
  <path d="M54,32 A24,24 0 0 1 78,56" fill="none" stroke="#FFC857" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="78" cy="56" r="2.2" fill="#FFC857"/>
</svg>
