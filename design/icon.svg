    <path d="M45.5,59.5 C47.5,58.5 49.5,59.5 50,61.5"/>
    <path d="M61.5,50 C59.5,50 58.5,52 58.5,54"/>
    <path d="M62.5,59.5 C60.5,58.5 58.5,59.5 58,61.5"/>
